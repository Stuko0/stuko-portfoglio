d3.select('#statsbar').text(fc + ' files · ' + dc + ' dirs · ' + E.length + ' edges · tokens 8:1');

var W = window.innerWidth, H = window.innerHeight - 62;
var svg = d3.select("#g").append("svg").attr("width", W).attr("height", H)
  .attr("style", "display:block;")
  .call(d3.zoom().scaleExtent([0.05, 10]).on("zoom", function(e) {
    g.attr("transform", e.transform);
  }));

// Add SVG defs for gradients and patterns
var defs = svg.append("defs");

// Radial gradient for vine edges
var vineGrad = defs.append("radialGradient").attr("id", "vineGrad").attr("cx", "50%").attr("cy", "50%").attr("r", "50%");
vineGrad.append("stop").attr("offset", "0%").attr("stop-color", "#8B1A1A").attr("stop-opacity", 0.4);
vineGrad.append("stop").attr("offset", "100%").attr("stop-color", "#1a0a0a").attr("stop-opacity", 0);

// Thorn filter glow
var glow = defs.append("filter").attr("id", "glow");
glow.append("feGaussianBlur").attr("stdDeviation", "3").attr("result", "coloredBlur");
var feMerge = glow.append("feMerge");
feMerge.append("feMergeNode").attr("in", "coloredBlur");
feMerge.append("feMergeNode").attr("in", "SourceGraphic");

// Rose gradient for nodes
var roseGrad = defs.append("radialGradient").attr("id", "roseGrad").attr("cx", "35%").attr("cy", "35%").attr("r", "65%");
roseGrad.append("stop").attr("offset", "0%").attr("stop-color", "#d4a0a0").attr("stop-opacity", 0.6);
roseGrad.append("stop").attr("offset", "50%").attr("stop-color", "#6b1818").attr("stop-opacity", 0.8);
roseGrad.append("stop").attr("offset", "100%").attr("stop-color", "#2a0505").attr("stop-opacity", 1);

// White rose gradient
var whiteRoseGrad = defs.append("radialGradient").attr("id", "whiteRoseGrad").attr("cx", "35%").attr("cy", "35%").attr("r", "65%");
whiteRoseGrad.append("stop").attr("offset", "0%").attr("stop-color", "#f5e8e0").attr("stop-opacity", 0.7);
whiteRoseGrad.append("stop").attr("offset", "50%").attr("stop-color", "#d4c0b8").attr("stop-opacity", 0.6);
whiteRoseGrad.append("stop").attr("offset", "100%").attr("stop-color", "#a09088").attr("stop-opacity", 0.5);

// Black rose gradient
var blackRoseGrad = defs.append("radialGradient").attr("id", "blackRoseGrad").attr("cx", "35%").attr("cy", "35%").attr("r", "65%");
blackRoseGrad.append("stop").attr("offset", "0%").attr("stop-color", "#3a2020").attr("stop-opacity", 0.6);
blackRoseGrad.append("stop").attr("offset", "50%").attr("stop-color", "#1a0a0a").attr("stop-opacity", 0.8);
blackRoseGrad.append("stop").attr("offset", "100%").attr("stop-color", "#0a0505").attr("stop-opacity", 1);

var g = svg.append("g");
var tip = d3.select("#tip");

function fi() {
  var q = d3.select("#q").property("value").toLowerCase();
  d3.selectAll(".nd").style("display", function(d) {
    return !q ? null : (d.path.toLowerCase().includes(q) || d.label.toLowerCase().includes(q)) ? null : "none";
  });
  d3.selectAll(".lk").style("display", function(d) {
    if (!q) return null;
    var s = typeof d.source == "object" ? d.source.path : "", t = typeof d.target == "object" ? d.target.path : "";
    return (s.toLowerCase().includes(q) || t.toLowerCase().includes(q)) ? null : "none";
  });
  var vn = 0, ve = 0;
  d3.selectAll(".nd").each(function() { if (this.style.display != "none") vn++; });
  d3.selectAll(".lk").each(function() { if (this.style.display != "none") ve++; });
  d3.select("#nc").text(vn);
  d3.select("#ec").text(ve);
}

var sim = d3.forceSimulation(N)
  .force("link", d3.forceLink(E).id(function(d) { return d.id; }).distance(60).strength(0.15))
  .force("charge", d3.forceManyBody().strength(-80))
  .force("center", d3.forceCenter(W / 2, H / 2))
  .force("collision", d3.forceCollide(12))
  .alphaDecay(0.035).velocityDecay(0.3);

// === VINE EDGES ===
var link = g.append("g").selectAll("line").data(E).join("line")
  .attr("class", "lk")
  .attr("stroke", "#7b4949")
  .attr("stroke-width", 0.8)
  .attr("stroke-dasharray", "3,4")
  .attr("opacity", 0.2);

// Thorn decorations on edges
var thornGroup = g.append("g").attr("class", "thorns");
var thorns = thornGroup.selectAll("path").data(E).join("path")
  .attr("class", "thorn")
  .attr("fill", "#2d1515")
  .attr("opacity", 0.08)
  .attr("d", function(d) { return "M0,0 L3,-2 L0,4 Z"; });

function getNodeColor(d) {
  if (d.type === "directory") return "#1a0a0a";
  var c = d.cluster || "#8B1A1A";
  if (c === "#f5e0d0" || c === "#f5e8e0") return "url(#whiteRoseGrad)";
  if (c === "#2a0808" || c === "#1a0a0a") return "url(#blackRoseGrad)";
  return "url(#roseGrad)";
}

function getNodeStroke(d) {
  if (d.type === "directory") return "rgba(180,100,100,0.2)";
  var c = d.cluster || "#8B1A1A";
  if (c === "#f5e0d0" || c === "#f5e8e0") return "rgba(220,190,180,0.3)";
  if (c === "#2a0808" || c === "#1a0a0a") return "rgba(100,40,40,0.15)";
  return "rgba(180,60,60,0.15)";
}

function getNodeR(d) {
  if (d.type === "directory") return 10;
  return 5 + Math.min((d.lines || 0) / 300, 7);
}

// === NODES — ROSE INSPIRED ===
var node = g.append("g").selectAll("g").data(N).join("g").attr("class", "nd")
  .call(d3.drag()
    .on("start", function(e, d) { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", function(e, d) { d.fx = e.x; d.fy = e.y; })
    .on("end", function(e, d) { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

// Outer glow circle
node.append("circle")
  .attr("class", "rose-glow")
  .attr("r", function(d) { return getNodeR(d) + 4; })
  .attr("fill", function(d) {
    var c = d.cluster || "#8B1A1A";
    if (c === "#f5e0d0") return "rgba(220,190,180,0.03)";
    if (c === "#2a0808") return "rgba(100,30,30,0.03)";
    return "rgba(180,60,60,0.04)";
  })
  .attr("stroke", "none")
  .attr("opacity", 0.5);

// Main node circle (the rose)
node.append("circle")
  .attr("class", "rose-node")
  .attr("r", getNodeR)
  .attr("fill", getNodeColor)
  .attr("stroke", getNodeStroke)
  .attr("stroke-width", function(d) { return d.type === "directory" ? 2 : 1; })
  .attr("opacity", function(d) { return d.type === "directory" ? 0.6 : 1; });

// Inner petal detail for larger nodes
node.filter(function(d) { return (d.lines || 0) > 30 || d.type === "directory"; })
  .append("circle")
  .attr("class", "rose-petal")
  .attr("r", function(d) { return Math.max(2, getNodeR(d) * 0.4); })
  .attr("fill", "none")
  .attr("stroke", function(d) {
    var c = d.cluster || "#8B1A1A";
    if (c === "#f5e0d0") return "rgba(240,220,210,0.15)";
    return "rgba(220,180,180,0.1)";
  })
  .attr("stroke-width", 0.5)
  .attr("opacity", 0.6);

// Text label
node.append("text")
  .attr("dx", function(d) { return getNodeR(d) + 6; })
  .attr("dy", 3.5)
  .text(function(d) { return d.label; })
  .attr("fill", function(d) {
    var c = d.cluster || "#8B1A1A";
    if (c === "#f5e0d0") return "rgba(220,200,190,0.6)";
    if (c === "#2a0808") return "rgba(180,150,140,0.4)";
    return "rgba(200,160,150,0.8)";
  })
  .attr("font-size", function(d) { return d.type === "directory" ? "11px" : "10px"; })
  .attr("font-weight", function(d) { return d.type === "directory" ? 600 : 300; })
  .style("font-style", "italic");

// === TOOLTIP ===
node.on("mouseenter", function(e, d) {
  var r = e.target.getBoundingClientRect();
  var ll = d.language || "unknown";
  var ic = d.imports ? d.imports.length : 0, ei = d.entities ? d.entities.length : 0;
  var lh = d.lines ? " " + d.lines + " lines" : "";
  var ei_html = ei ? "<br>" + ei + " entities" : "";
  var imp_html = ic ? '<div class="ti">❧ ' + d.imports.slice(0, 8).join(", ") + (d.imports.length > 8 ? ", +…" : "") + "</div>" : "";
  tip.style("display", "block")
    .style("left", Math.min(r.right + 18, W - 440) + "px")
    .style("top", Math.max(66, Math.min(r.top - 6, H - 200)) + "px")
    .html('<div class="tp">' + d.path + '</div><div class="tm">' + ll + lh + ei_html + '</div>' + imp_html);
})
.on("mouseleave", function() { tip.style("display", "none"); });

// === TICK ===
sim.on("tick", function() {
  link
    .attr("x1", function(d) { return d.source.x; })
    .attr("y1", function(d) { return d.source.y; })
    .attr("x2", function(d) { return d.target.x; })
    .attr("y2", function(d) { return d.target.y; });

  thorns.attr("transform", function(d) {
    var mx = (d.source.x + d.target.x) / 2;
    var my = (d.source.y + d.target.y) / 2;
    var dx = d.target.x - d.source.x;
    var dy = d.target.y - d.source.y;
    var angle = Math.atan2(dy, dx) * 180 / Math.PI;
    return "translate(" + mx + "," + my + ") rotate(" + angle + ") scale(0.8)";
  });

  node.attr("transform", function(d) {
    return "translate(" + d.x.toFixed(1) + "," + d.y.toFixed(1) + ")";
  });
});

function uc() {
  var vn = 0, ve = 0;
  d3.selectAll(".nd").each(function() { vn++; });
  d3.selectAll(".lk").each(function() { ve++; });
  d3.select("#nc").text(vn);
  d3.select("#ec").text(ve);
}
sim.on("end", uc);
setTimeout(function() { sim.stop(); uc(); }, 35000);
uc();
</script>
</body>
</html>
