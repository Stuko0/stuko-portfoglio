name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy dist --project-name stuko-portfoglio --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy subscribe Worker
        run: |
          printf '%s' '{"main_module":"subscribe.js","compatibility_date":"2026-09-01"}' > "$RUNNER_TEMP/worker_meta.json"
          RESP=$(curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F "metadata=@$RUNNER_TEMP/worker_meta.json;type=application/json" \
            -F "subscribe.js=@worker/subscribe.js;type=application/javascript+module" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/subscribe")
          echo "$RESP"
          echo "$RESP" | grep -qE '"success":\s*true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
